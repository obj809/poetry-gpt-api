# docker-compose.yml

services:
  api:
    build: .
    container_name: poetry-gpt-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3001:3001"
    networks:
      - default
      - litellm
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  litellm:
    name: litellm-docker-container_default
    external: true
